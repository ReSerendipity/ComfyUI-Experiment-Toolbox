# comfyui-experiment-toolbox: minimal Python CI
# 步骤：语法编译 → 锁文件可解析 → 三个纯标准库门禁 selftest → 结构轨样本验收 → 公开仓路径红线自检
# 注意：本 CI 不 import comfy.*（runner 上没有 ComfyUI 环境），只跑纯标准库的门禁自检。
# 2026-10-16 E1~E8：门禁扩至 ⑪（⑧ 视频质检 / ⑨ 趋势回归 / ⑩ 显存档位 / ⑪ 变体闭环）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax + gate selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Resolve locked third-party deps (numpy/Pillow)
        run: python -m pip install -r requirements-lock.txt

      - name: Gate ① ledger×产物树对账 selftest
        run: python "10_模型家族横评/lib_ledger_verify.py" --selftest

      - name: Gate ② prompt QC on committed prompts
        run: python "10_模型家族横评/lib_prompt_qc.py" "10_模型家族横评/prompts"

      - name: Gate ③ inventory-gate synthetic three-state selftest
        working-directory: "10_模型家族横评"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from lib_inventory_gate import _selftest_synthetic
          steps = _selftest_synthetic()
          for msg, ok in steps:
              print(("OK  " if ok else "FAIL") + " " + msg)
          bad = [m for m, ok in steps if ok is False]
          sys.exit(1 if bad else 0)
          PY

      # 结构轨验收：只作用于仓内脱敏样本（不碰本机 ComfyUI 原件），
      # ① 样本全部结构不变量通过；② 逐类破坏不变量必须 FAIL 且指明不变量
      - name: Gate ④ 05 结构改造 verify_upgrade 样本 selftest
        run: python -X utf8 "05_结构改造脚本/verify_upgrade.py" --selftest

      # AGENTS.md 公开仓红线自检：只读扫描纳入版本管理的 .py，命中字面本机绝对路径即失败。
      - name: Gate ⑤ no literal machine absolute paths in tracked .py/.json/.md
        run: |
          python - <<'PY'
          import re, subprocess, sys

          # 违规口径（AGENTS.md 铁律「公开仓红线：不含本机绝对路径」）：
          #   1) 盘符开头的字面路径        C:\... / c:/...
          #   2) 用户主目录形态的字面路径  /home/<u>/... / /Users/<u>/... / ~/...
          DRIVE = re.compile(r"(?<![A-Za-z0-9])[A-Za-z]:[\\/]{1,2}\S")
          HOME = re.compile(r"(?<![A-Za-z0-9])(?:/(?:home|Users)/[A-Za-z0-9._-]+/\S|~/\S)")
          # 不算违规：运行时才展开的写法。%USERPROFILE% / $HOME 本身不命中上面两个式子；
          # "~/..." 交给 os.path.expanduser() 展开，同样属于运行时形式 → 按前缀豁免。
          # 负向后顾断言排除 http:// 等 URL scheme（字母前还有字母/数字时不匹配）。
          RUNTIME = re.compile(r"(?:expandvars|expanduser)\(\s*(?:[rb]{1,2}|u)?['\"]$")

          raw = subprocess.run(
              ["git", "-c", "core.quotepath=false", "ls-files", "-z", "--", "*.py", "*.json", "*.md"],
              stdout=subprocess.PIPE, check=True,
          ).stdout
          files = [f.decode("utf-8", "surrogateescape") for f in raw.split(b"\\0") if f]
          # 历史归档原件（99_归档/）保持原貌，不参与本机路径扫描。
          files = [f for f in files if not f.startswith("99_归档/")]

          hits = []
          for rel in files:
              with open(rel, encoding="utf-8", errors="replace") as fh:
                  for lineno, line in enumerate(fh, 1):
                      text = line.rstrip("\n")
                      for regex in (DRIVE, HOME):
                          m = regex.search(text)
                          if m and not RUNTIME.search(text[: m.start()]):
                              hits.append((rel, lineno, m.group(0), text.strip()))
                              break

          print("no-literal-machine-path gate: scanned %d tracked file(s) (.py/.json/.md)" % len(files))
          if hits:
              print("::error::AGENTS.md 公开仓红线：tracked 源文件（.py/.json/.md）含字面本机绝对路径，命中 %d 行" % len(hits))
              for rel, lineno, token, text in hits:
                  print("  %s:%d  %s" % (rel, lineno, token))
                  print("      | %s" % text[:160])
              sys.exit(1)
          print("OK: no literal machine absolute paths in tracked .py/.json/.md sources")
          PY

      # Gate ⑥ 模块依赖方向门禁：目录结构即架构边界（对应根 README 第四节依赖矩阵）。
      # 纯标准库内联实现（import-linter 的最小等价子集，2026-10-15，架构技术债 P1-1；
      # 不引入新工具，沿用 Gate ⑤ 的内联脚本模式）。已知限制：import a, b 多名导入
      # 仅解析首名（本仓无此形态）。
      # 规则：01/02/04/05/根入口 不得跨轨 import；03 只准 import 01；09 只准 import 01,02；
      #       10 只准 import 01；同轨互 import 放行；tests/ 目录豁免（测试是纯消费者）。
      - name: Gate ⑥ module dependency direction (track-level)
        run: |
          python - <<'PY'
          import re, subprocess, sys

          TRACKS = {"01_工作流扁平化": "01", "02_调度器sigma分析": "02", "03_受控跑测": "03",
                    "04_结果分析": "04", "05_结构改造脚本": "05", "09_Web面板": "09",
                    "10_模型家族横评": "10"}
          ALLOWED = {"01": set(), "02": set(), "03": {"01"}, "04": set(),
                     "05": set(), "09": {"01", "02"}, "10": {"01"}, "root": set()}

          raw = subprocess.run(
              ["git", "-c", "core.quotepath=false", "ls-files", "-z", "--", "*.py"],
              stdout=subprocess.PIPE, check=True,
          ).stdout
          files = [f.decode("utf-8", "surrogateescape") for f in raw.split(b"\0") if f]

          owner_of_file, module_owner = {}, {}
          for rel in files:
              if rel.startswith("tests/"):
                  owner_of_file[rel] = "tests"
                  continue
              track = next((TRACKS[t] for t in TRACKS if rel.startswith(t + "/")), "root")
              owner_of_file[rel] = track
              module_owner.setdefault(rel.rsplit("/", 1)[-1][:-3], track)

          IMPORT = re.compile(r"^\s*(?:import|from)\s+([A-Za-z_][A-Za-z0-9_]*)")
          violations = []
          for rel in files:
              src = owner_of_file[rel]
              if src == "tests":
                  continue
              with open(rel, encoding="utf-8", errors="replace") as fh:
                  for lineno, line in enumerate(fh, 1):
                      m = IMPORT.match(line)
                      if not m:
                          continue
                      dst = module_owner.get(m.group(1))
                      if dst is None or dst == src or dst in ALLOWED[src]:
                          continue
                      violations.append((rel, lineno, m.group(1), src, dst))

          print("dependency-direction gate: scanned %d tracked .py file(s)" % len(files))
          if violations:
              print("::error::跨轨 import 违反依赖方向矩阵，命中 %d 处" % len(violations))
              for rel, lineno, mod, src, dst in violations:
                  print("  %s:%d  import %s  (%s -> %s)" % (rel, lineno, mod, src, dst))
              sys.exit(1)
          print("OK: track-level dependency direction holds")
          PY
      # Gate ⑦ 标准库单元测试（tests/，2026-10-15，测试维度 P1-1/P1-3）。
      # 不引入 pytest（禁装依赖）：用 unittest 承载，test_*.py 命名保持 pytest 兼容可收集。
      - name: Gate ⑦ stdlib unittest (flatten / logutil / panel API)
        run: python -X utf8 -m unittest discover -s tests -v

      # Gate ⑧ 视频质检 vqc 合成三态自检（2026-10-16，E1）。
      # runner 上没有 ffmpeg 时脚本自身降级为 SKIP（exit 0），不把环境差异伪装成失败；
      # 有 ffmpeg 时必须三态全命中（good 干净 / 黑帧命中 / 无音轨命中）。
      - name: Gate ⑧ video QC selftest (good / black-frame / no-audio)
        run: python -X utf8 "10_模型家族横评/lib_video_qc.py" --selftest

      # Gate ⑨ 跨快照趋势回归 selftest（2026-10-16，E5）。
      # 合成双快照覆盖：一致不误报 / ok 率下降命中硬回归 / 耗时翻倍判 slower /
      # 对象消失判 disappeared / 扩展名差异不算假回归（历史台账全是 .safetensors 后缀差异）。
      - name: Gate ⑨ trend regression selftest (snapshot pairs)
        run: python -X utf8 "10_模型家族横评/trend_family.py" --selftest

      # Gate ⑩ 显存自适应 selftest（2026-10-16，E2）。
      # 纯逻辑自检（不碰 GPU，runner 上无 nvidia-smi 也能全绿）：
      # 时长→档位单调性、与实测边界表逐档对齐、小卡降底档、预算未知保守降档、OOM 识别不误伤参数错。
      - name: Gate ⑩ VRAM ladder selftest (tier policy / OOM pattern)
        run: python -X utf8 "03_受控跑测/lib_vram.py" --selftest

      # Gate ⑪ 提示词变体闭环 selftest（2026-10-16，E8）。
      # 覆盖：变体词条白名单、文本层 QC 淘汰、属性片段不被 too_short 误杀、
      # judge 三条淘汰路径（全家族失败 / 低于阈值 / 存活带家族评分）、落盘前递归脱敏（Gate ⑤）。
      - name: Gate ⑪ prompt closed-loop selftest (variants / QC / judge / sanitize)
        run: python -X utf8 "10_模型家族横评/lib_prompt_closedloop.py" selftest