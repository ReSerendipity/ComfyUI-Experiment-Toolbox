name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi

      # §10.1 远端优先 + 产物可校验：归档与 SHA256SUMS 全部在远端生成，
      # 本地不打包；命名取不可变 SemVer tag，禁 floating latest；不使用 GPG。
      - name: Build source archive, SHA256SUMS, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE="ComfyUI-Experiment-Toolbox-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="ComfyUI-Experiment-Toolbox-${TAG}/" -o "${ARCHIVE}" HEAD
          sha256sum "${ARCHIVE}" > SHA256SUMS.txt
          gh release create "$TAG" --generate-notes
          gh release upload "$TAG" "${ARCHIVE}" SHA256SUMS.txt
